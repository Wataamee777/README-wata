<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>WebGL ピアノロール</title>
  <style>
    body {
      margin: 0;
      background: #1a1a1a;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #controls {
      margin-bottom: 15px;
      z-index: 10;
    }
    #glCanvas {
      background: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 4px;
    }
    button, input {
      padding: 8px 12px;
      margin: 0 5px;
      cursor: pointer;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
    }
    button:hover {
      background: #444;
    }
  </style>
  <!-- ライブラリの読み込み -->
  <script src="https://unpkg.com/@tonejs/midi"></script>
  <script src="https://unpkg.com/tone"></script>
</head>
<body>

  <div id="controls">
    <input type="file" id="midi" accept=".mid,.midi">
    <button id="play">再生</button>
    <button id="stop">停止</button>
  </div>

  <!-- 1つに統合されたWebGL用のキャンバス -->
  <canvas id="glCanvas" width="800" height="600"></canvas>

  <script src="script.js"></script>
</body>
</html>
