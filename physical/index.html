<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebGPU Physics Simulation Fix</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 16px;
            border-radius: 40px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.08);
            z-index: 10;
            border: 1px solid rgba(0,0,0,0.1);
        }
        button {
            background: transparent;
            color: #666666;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
        }
        button.active {
            background: #000000;
            color: #ffffff;
        }
        button#btn-clear {
            color: #ff3b30;
        }
        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #000000;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            background: rgba(255,255,255,0.85);
            padding: 6px 12px;
            border-radius: 6px;
            pointer-events: none;
            border: 1px solid rgba(0,0,0,0.1);
        }
        #error-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            color: #ff3b30;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
            z-index: 100;
            font-size: 16px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <button id="btn-wall" class="active">🛠 壁を描く</button>
        <button id="btn-ball">🟢 玉を落とす</button>
        <button id="btn-clear">🗑 クリア</button>
    </div>

    <div id="error-overlay">
        <div style="font-size: 40px; margin-bottom: 20px;">⚠️</div>
        <div id="error-text"></div>
    </div>

    <div id="stats">FPS: -- | Balls: 0 / 32768 | Walls: 0 / 512</div>
    <canvas id="gpuCanvas"></canvas>

<script type="module">

const MAX_BALLS = 32768; 
const MAX_WALLS = 512;
const BALL_RADIUS = 12.0;

let currentMode = 'wall'; 
let isDrawing = false;

const ballsData = new Float32Array(MAX_BALLS * 4);
let ballCount = 0;

const wallsData = new Float32Array(MAX_WALLS * 4);
let wallCount = 0;

const previewWall = { startX: 0, startY: 0, endX: 0, endY: 0, isActive: 0 };

const computeShaderSource = `
    struct Ball { pos: vec2<f32>, vel: vec2<f32> }
    struct Wall { p0: vec2<f32>, p1: vec2<f32> }
    struct SimParams {
        canvasSize: vec2<f32>,
        ballRadius: f32,
        gravity: f32,
        dt: f32,
        ballCount: u32,
        wallCount: u32,
        pad0: u32,
        pad1: u32,
    }

    @group(0) @binding(0) var<storage, read_write> balls: array<Ball>;
    @group(0) @binding(1) var<storage, read> walls: array<Wall>;
    @group(0) @binding(2) var<uniform> params: SimParams;

    @compute @workgroup_size(256)
    fn computeMain(@builtin(global_invocation_id) global_id: vec3<u32>) {
        let index = global_id.x;
        if (index >= params.ballCount) { return; }

        var ball = balls[index];
        let r = params.ballRadius;
        
        ball.vel.y += params.gravity * params.dt;
        var nextPos = ball.pos + ball.vel * params.dt;

        for (var i = 0u; i < params.wallCount; i = i + 1u) {
            let wall = walls[i];
            let ab = wall.p1 - wall.p0;
            let ac = nextPos - wall.p0;
            let lenSq = dot(ab, ab);
            var t = 0.0;
            if (lenSq > 0.0) { t = clamp(dot(ac, ab) / lenSq, 0.0, 1.0); }
            let closestPoint = wall.p0 + ab * t;
            let toBall = nextPos - closestPoint;
            let dist = length(toBall);

            if (dist < r && dist > 0.0) {
                let normal = toBall / dist;
                let vNormal = dot(ball.vel, normal);
                let tangent = vec2<f32>(-normal.y, normal.x);
                let vTangent = dot(ball.vel, tangent);
                
                nextPos = closestPoint + normal * r;

                if (vNormal < 0.0) {
                    ball.vel = tangent * vTangent * 0.95 - normal * vNormal * 0.5;
                }
            }
        }

        if (nextPos.y > params.canvasSize.y - r) {
            nextPos.y = params.canvasSize.y - r;
            if (abs(ball.vel.y) < 30.0) { ball.vel.y = 0.0; ball.vel.x *= 0.95; } 
            else { ball.vel.y = -ball.vel.y * 0.4; }
        }
        if (nextPos.x < r) { nextPos.x = r; ball.vel.x = -ball.vel.x * 0.5; } 
        else if (nextPos.x > params.canvasSize.x - r) { nextPos.x = params.canvasSize.x - r; ball.vel.x = -ball.vel.x * 0.5; }

        ball.pos = nextPos;
        balls[index] = ball;
    }
`;

const renderShaderSource = `
    struct Ball { pos: vec2<f32>, vel: vec2<f32> }
    struct Wall { p0: vec2<f32>, p1: vec2<f32> }
    struct SimParams {
        canvasSize: vec2<f32>,
        ballRadius: f32,
        gravity: f32,
        dt: f32,
        ballCount: u32,
        wallCount: u32,
        pad0: u32,
        pad1: u32,
    }
    struct PreviewParams {
        p0: vec2<f32>,
        p1: vec2<f32>,
        isActive: u32,
        pad0: u32,
        pad1: u32,
        pad2: u32,
    }

    @group(0) @binding(0) var<storage, read> balls: array<Ball>;
    @group(0) @binding(1) var<storage, read> walls: array<Wall>;
    @group(0) @binding(2) var<uniform> params: SimParams;
    @group(0) @binding(3) var<uniform> preview: PreviewParams;

    @vertex
    fn vertexBall(@builtin(vertex_index) vertexIdx: u32, @builtin(instance_index) instanceIdx: u32) -> @builtin(position) vec4<f32> {
        let ball = balls[instanceIdx];
        var offsets = array<vec2<f32>, 4>(
            vec2<f32>(-1.0, -1.0),
            vec2<f32>( 1.0, -1.0),
            vec2<f32>(-1.0,  1.0),
            vec2<f32>( 1.0,  1.0)
        );
        let offset = offsets[vertexIdx];
        let vertexPos = ball.pos + offset * params.ballRadius;
        
        let x = (vertexPos.x / params.canvasSize.x) * 2.0 - 1.0;
        let y = 1.0 - (vertexPos.y / params.canvasSize.y) * 2.0;

        return vec4<f32>(x, y, 0.0, 1.0);
    }

    @fragment
    fn fragmentBall() -> @location(0) vec4<f32> {
        return vec4<f32>(0.0, 0.8, 0.2, 1.0);
    }

    @vertex
    fn vertexWall(@builtin(vertex_index) vertexIdx: u32, @builtin(instance_index) instanceIdx: u32) -> @builtin(position) vec4<f32> {
        var p = vec2<f32>(0.0);
        if (instanceIdx < params.wallCount) {
            let w = walls[instanceIdx];
            p = select(w.p0, w.p1, vertexIdx == 1u);
        } else {
            p = select(preview.p0, preview.p1, vertexIdx == 1u);
        }
        
        let x = (p.x / params.canvasSize.x) * 2.0 - 1.0;
        let y = 1.0 - (p.y / params.canvasSize.y) * 2.0;

        return vec4<f32>(x, y, 0.0, 1.0);
    }

    @fragment
    fn fragmentWall() -> @location(0) vec4<f32> {
        return vec4<f32>(0.0, 0.0, 0.0, 1.0);
    }
`;

function showError(message) {
    document.getElementById("error-overlay").style.display = "flex";
    document.getElementById("error-text").innerHTML = message;
}

async function init() {
    if (!navigator.gpu) {
        showError("<strong>お使いの環境はWebGPUに対応していません。</strong>");
        return;
    }

    let adapter, device;
    try {
        adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
            showError("GPUアダプターが見つかりませんでした。");
            return;
        }
        device = await adapter.requestDevice();
    } catch (e) {
        showError("GPUの初期化に失敗しました: " + e.message);
        return;
    }

    const canvas = document.getElementById("gpuCanvas");
    const ctx = canvas.getContext("webgpu");
    const presentationFormat = navigator.gpu.getPreferredCanvasFormat();

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.configure({
            device,
            format: presentationFormat,
            alphaMode: "opaque"
        });
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const ballsBuffer = device.createBuffer({ 
        size: ballsData.byteLength, 
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST 
    });
    const wallsBuffer = device.createBuffer({ 
        size: wallsData.byteLength, 
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST 
    });
    const paramsBuffer = device.createBuffer({ 
        size: 32, 
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST 
    });
    const previewBuffer = device.createBuffer({ 
        size: 32, 
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST 
    });

    const computeModule = device.createShaderModule({ code: computeShaderSource });
    const renderModule = device.createShaderModule({ code: renderShaderSource });

    const bindGroupLayout = device.createBindGroupLayout({
        entries: [
            { binding: 0, visibility: GPUShaderStage.COMPUTE | GPUShaderStage.VERTEX, buffer: { type: "storage" } },
            { binding: 1, visibility: GPUShaderStage.COMPUTE | GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
            { binding: 2, visibility: GPUShaderStage.COMPUTE | GPUShaderStage.VERTEX, buffer: { type: "uniform" } },
            { binding: 3, visibility: GPUShaderStage.VERTEX, buffer: { type: "uniform" } }
        ]
    });

    const pipelineLayout = device.createPipelineLayout({
        bindGroupLayouts: [bindGroupLayout]
    });

    const computePipeline = device.createComputePipeline({ 
        layout: pipelineLayout, 
        compute: { module: computeModule, entryPoint: "computeMain" } 
    });
    
    const ballPipeline = device.createRenderPipeline({
        layout: pipelineLayout,
        vertex: { module: renderModule, entryPoint: "vertexBall" },
        fragment: { module: renderModule, entryPoint: "fragmentBall", targets: [{ format: presentationFormat }] },
        primitive: { topology: "triangle-strip" }
    });

    const wallPipeline = device.createRenderPipeline({
        layout: pipelineLayout,
        vertex: { module: renderModule, entryPoint: "vertexWall" },
        fragment: { module: renderModule, entryPoint: "fragmentWall", targets: [{ format: presentationFormat }] },
        primitive: { topology: "line-list" }
    });

    const bindGroup = device.createBindGroup({
        layout: bindGroupLayout,
        entries: [
            { binding: 0, resource: { buffer: ballsBuffer } },
            { binding: 1, resource: { buffer: wallsBuffer } },
            { binding: 2, resource: { buffer: paramsBuffer } },
            { binding: 3, resource: { buffer: previewBuffer } }
        ]
    });

    const btnWall = document.getElementById("btn-wall");
    const btnBall = document.getElementById("btn-ball");
    const btnClear = document.getElementById("btn-clear");
    const statsDiv = document.getElementById("stats");

    btnWall.onclick = () => { currentMode = 'wall'; btnWall.classList.add('active'); btnBall.classList.remove('active'); };
    btnBall.onclick = () => { currentMode = 'ball'; btnBall.classList.add('active'); btnWall.classList.remove('active'); };
    btnClear.onclick = () => { ballCount = 0; wallCount = 0; previewWall.isActive = 0; };

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return [clientX - rect.left, clientY - rect.top];
    }

    function pointerDown(x, y) {
        isDrawing = true;
        if (currentMode === 'ball') {
            spawnSingleBall(x, y);
        } else {
            previewWall.startX = x; previewWall.startY = y;
            previewWall.endX = x; previewWall.endY = y;
            previewWall.isActive = 1;
        }
    }

    function pointerMove(x, y) {
        if (!isDrawing) return;
        if (currentMode === 'ball') {
            spawnSingleBall(x, y);
        } else {
            previewWall.endX = x; previewWall.endY = y;
        }
    }

    function pointerUp() {
        if (!isDrawing) return;
        isDrawing = false;
        if (currentMode === 'wall' && previewWall.isActive === 1) {
            const dx = previewWall.endX - previewWall.startX;
            const dy = previewWall.endY - previewWall.startY;
            if (Math.sqrt(dx*dx + dy*dy) > 5 && wallCount < MAX_WALLS) {
                const offset = wallCount * 4;
                wallsData[offset]     = previewWall.startX;
                wallsData[offset + 1] = previewWall.startY;
                wallsData[offset + 2] = previewWall.endX;
                wallsData[offset + 3] = previewWall.endY;
                wallCount++;
                device.queue.writeBuffer(wallsBuffer, 0, wallsData);
            }
            previewWall.isActive = 0;
        }
    }

    function spawnSingleBall(ex, ey) {
        if (ballCount >= MAX_BALLS) return;
        const offset = ballCount * 4;
        ballsData[offset]     = ex;
        ballsData[offset + 1] = ey;
        ballsData[offset + 2] = (Math.random() - 0.5) * 50; 
        ballsData[offset + 3] = (Math.random() - 0.5) * 20;  
        ballCount++;
        
        device.queue.writeBuffer(ballsBuffer, offset * 4, ballsData.subarray(offset, offset + 4));
    }

    canvas.addEventListener('mousedown', e => { const [x,y] = getPos(e); pointerDown(x,y); });
    canvas.addEventListener('mousemove', e => { const [x,y] = getPos(e); pointerMove(x,y); });
    window.addEventListener('mouseup', pointerUp);

    canvas.addEventListener('touchstart', e => { if(e.touches.length > 0) { const [x,y] = getPos(e); pointerDown(x,y); } e.preventDefault(); }, {passive: false});
    canvas.addEventListener('touchmove', e => { if(e.touches.length > 0) { const [x,y] = getPos(e); pointerMove(x,y); } e.preventDefault(); }, {passive: false});
    window.addEventListener('touchend', pointerUp);

    let lastTime = performance.now();
    let frameCount = 0, fps = 60;

    setInterval(() => {
        statsDiv.textContent = `FPS: ${fps} | Balls: ${ballCount} / ${MAX_BALLS} | Walls: ${wallCount} / ${MAX_WALLS}`;
    }, 250);

    function frame() {
        const now = performance.now();
        frameCount++;
        if (now >= lastTime + 1000) { fps = frameCount; frameCount = 0; lastTime = now; }

        const simParamsBuffer = new ArrayBuffer(32);
        const simParamsF32 = new Float32Array(simParamsBuffer);
        const simParamsU32 = new Uint32Array(simParamsBuffer);

        simParamsF32[0] = canvas.width;
        simParamsF32[1] = canvas.height;
        simParamsF32[2] = BALL_RADIUS;
        simParamsF32[3] = 980.0;
        simParamsF32[4] = 1/60;
        simParamsU32[5] = ballCount;
        simParamsU32[6] = wallCount;

        device.queue.writeBuffer(paramsBuffer, 0, simParamsBuffer);

        const previewParamsBuffer = new ArrayBuffer(32);
        const previewParamsF32 = new Float32Array(previewParamsBuffer);
        const previewParamsU32 = new Uint32Array(previewParamsBuffer);

        previewParamsF32[0] = previewWall.startX;
        previewParamsF32[1] = previewWall.startY;
        previewParamsF32[2] = previewWall.endX;
        previewParamsF32[3] = previewWall.endY;
        previewParamsU32[4] = previewWall.isActive;

        device.queue.writeBuffer(previewBuffer, 0, previewParamsBuffer);

        const commandEncoder = device.createCommandEncoder();

        if (ballCount > 0) {
            const computePass = commandEncoder.beginComputePass();
            computePass.setPipeline(computePipeline);
            computePass.setBindGroup(0, bindGroup);
            computePass.dispatchWorkgroups(Math.ceil(ballCount / 256));
            computePass.end();
        }

        const renderPass = commandEncoder.beginRenderPass({
            colorAttachments: [{
                view: ctx.getCurrentTexture().createView(),
                clearValue: { r: 1.0, g: 1.0, b: 1.0, a: 1.0 }, 
                loadOp: "clear", storeOp: "store"
            }]
        });

        renderPass.setBindGroup(0, bindGroup);

        let totalWallsToDraw = wallCount + (previewWall.isActive ? 1 : 0);
        if (totalWallsToDraw > 0) {
            renderPass.setPipeline(wallPipeline);
            renderPass.draw(2, totalWallsToDraw, 0, 0);
        }

        if (ballCount > 0) {
            renderPass.setPipeline(ballPipeline);
            renderPass.draw(4, ballCount, 0, 0);
        }

        renderPass.end();
        device.queue.submit([commandEncoder.finish()]);
        
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
}

init();
</script>
</body>
</html>
